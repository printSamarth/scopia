[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scopia"
version = "1.0.0"
description = "See the shape of a code change before reading its lines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Samarth Patel" }]
keywords = ["code-review", "diff", "call-graph", "static-analysis", "git", "react", "java"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
]

# Kept deliberately small. Every dependency is a way for `pip install` to fail on
# someone else's machine, and every one of these ships abi3 wheels, so no compiler
# is needed at install time.
dependencies = [
  "tree-sitter>=0.23,<0.27",
  "tree-sitter-python>=0.23",
  "tree-sitter-php>=0.23",
  "tree-sitter-java>=0.23",
  # `.js`/`.jsx` and `.ts`/`.tsx` need separate grammars for the same reason
  # TypeScript ships two parsers: `<T>value` is a cast in one, an element in the other.
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
# Optional: `scopia --lsp` uses it to confirm name-matched calls. Pure Python, no Node.
lsp = ["jedi-language-server>=0.40"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
scopia = "scopia.cli:main"

[project.urls]
Homepage = "https://github.com/printSamarth/scopia"
Issues = "https://github.com/printSamarth/scopia/issues"

[tool.hatch.build.targets.wheel]
packages = ["scopia"]

[tool.hatch.build.targets.sdist]
# The README points at GitHub for images, so shipping them would add 4MB to every
# source install for nothing. Tests ship: they are how someone verifies a build.
exclude = ["docs", ".github"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The page template is embedded markup; wrapping its lines hurts rather than helps.
"scopia/render/html.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
